name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Lint (syntax errors, undefined names, unused imports)
        run: ruff check validation tracking evaluation registry serving training/train.py training/prepare.py training/run_config.py tests
      - name: Tests
        run: python -m pytest -q

  docker:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t plant-disease-api .
      - name: Start the container
        run: docker run -d --name api -p 8000:8000 plant-disease-api
      - name: Wait until the model is loaded
        run: |
          for i in $(seq 1 45); do curl -sf http://localhost:8000/ready && exit 0; sleep 2; done
          echo "service did not become ready"; exit 1
      - name: Predict, and check an invalid upload is refused
        run: |
          curl -sf http://localhost:8000/model
          docker exec api python -c "from PIL import Image; Image.effect_noise((256, 256), 60).convert('RGB').save('/tmp/leaf.jpg')"
          docker cp api:/tmp/leaf.jpg leaf.jpg
          curl -sf -F "file=@leaf.jpg" http://localhost:8000/predict
          test "$(curl -s -o /dev/null -w '%{http_code}' -F 'file=@README.md' http://localhost:8000/predict)" = "415"
      - name: Container logs
        if: failure()
        run: docker logs api
